# air live-reload config — used by `make dev` when air is installed.
# https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go run ./cmd/build -out \"${OUT:-dist}\" -base-path \"${BASE_PATH:-}\" -site-url \"${SITE_URL:-}\" -visitor-badge=${VISITOR_BADGE:-false} && go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  full_bin = "./tmp/server -dir \"${OUT:-dist}\" -base-path \"${BASE_PATH:-}\" -addr \":${PORT:-8080}\""
  # Rebuild on Go changes and on template/asset edits (assets are embedded).
  include_ext = ["go", "html", "css", "js", "svg", "png", "woff", "woff2", "toml", "mod"]
  include_dir = ["cmd", "internal", "web"]
  exclude_dir = ["tmp", "bin", "dist", "sample", "docs"]
  delay = 200
  stop_on_error = true

[misc]
  clean_on_exit = true
